name: Build and Push release

env:
  IMAGE_NAME: ghcr.io/justereseau/caddy

on:
  push:
    branches: ["main"]

jobs:
  push-store-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v5

      - name: Extract Caddy version
        id: caddy
        run: echo "version=$(grep -oE '^ARG CADDY_VERSION=.*' Dockerfile | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.caddy.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.caddy.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.caddy.outputs.version }}
            type=raw,value=latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
